# Image of the Googlebook Linux environment, resolved at installation time through the OCI
# registry API: Debian's official image (Docker Hub library/debian, built by Debian's
# debuerreotype). The tag names a release, not "stable", so a running environment never jumps
# to the next Debian release on its own.
registry=registry-1.docker.io
auth=https://auth.docker.io/token?service=registry.docker.io
repository=library/debian
tag=trixie
